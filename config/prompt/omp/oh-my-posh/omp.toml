[upgrade]
source = 'cdn'
interval = '168h'
auto = false
notice = false

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = ' {{ if .WSL }}WSL in {{ end }}{{.Icon}} '
foreground = 'p:Lavender'
background = 'p:Crust'
type = 'os'
style = 'powerline'
foreground_templates = ['{{ if .Root }}p:Pink{{ end }}']

[blocks.segments.properties]
cache_duration = 'none'

[[blocks.segments]]
template = ' {{ .Path }} '
foreground = 'p:Crust'
powerline_symbol = ''
background = 'p:Lavender'
type = 'path'
style = 'powerline'

[blocks.segments.properties]
cache_duration = 'none'
max_depth = 2.0
style = 'agnoster_short'

[[blocks.segments]]
template = ' '
type = 'project'
style = 'plain'

[blocks.segments.properties]
cache_duration = 'none'

[[blocks.segments]]
template = ' {{ if .Segments.Project.Name }}{{ .Segments.Project.Name }}{{ else }}{{ .Segments.Git.RepoName }}{{ end }}'
foreground = 'p:Crust'
powerline_symbol = ''
background = 'p:Flamingo'
type = 'text'
style = 'powerline'

[blocks.segments.properties]
cache_duration = 'none'

[[blocks.segments]]
foreground = 'p:Crust'
powerline_symbol = ''
background = 'p:Rosewater'
type = 'git'
style = 'powerline'
background_templates = [
    '{{ if or (.Working.Changed) (.Staging.Changed) }}p:Yellow{{ end }}',
    '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:Maroon{{ end }}',
    '{{ if gt .Ahead 0 }}p:Peach{{ end }}',
    '{{ if gt .Behind 0 }}p:Peach{{ end }}',
]
templates = [
    ' {{ .HEAD }}',
    '{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}',
    '{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}',
    '{{ if and (.Staging.Changed) (.Working.Changed) }} |{{ end }}',
    '{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}',
    '{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}',
    '{{ if gt .WorktreeCount 0 }}  {{ .WorktreeCount }}{{ end }}',
]

[blocks.segments.properties]
cache_duration = 'none'
fetch_stash_count = true
fetch_status = true
fetch_working_count = true

[[blocks]]
type = 'prompt'
alignment = 'right'

[[blocks.segments]]
foreground = 'p:Crust'
powerline_symbol = ''
background = 'p:Teal'
type = 'executiontime'
style = 'powerline'
background_templates = ['{{ if gt .Code 0 }}p:Red{{ end }}']
invert_powerline = true

[blocks.segments.properties]
always_enabled = true
cache_duration = 'none'
style = 'austin'

[[blocks.segments]]
#template = '  '
template = "  {{ round .PhysicalPercentUsed .Precision }}% "
foreground = 'p:Crust'
powerline_symbol = ''
background = 'p:Mauve'
type = 'sysinfo'
style = 'diamond'
invert_powerline = true

[blocks.segments.properties]
cache_duration = 'none'
time_format = '15:04:05'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = '❯ '
foreground = 'p:Teal'
type = 'exit'
style = 'plain'
foreground_templates = ['{{ if gt .Code 0 }}p:Red{{ end }}']

[blocks.segments.properties]
always_enabled = true
cache_duration = 'none'

[transient_prompt]
foreground_templates = ["{{if gt .Code 0}}red{{end}}"]
background = 'transparent'
template = '❯ '
